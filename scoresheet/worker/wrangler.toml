name = "aahl-scoresheet-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# CORS origin for the PWA. Set to your Pages URL once deployed.
[vars]
ALLOWED_ORIGIN = "https://aahl-scoresheet.pages.dev"
SEASON_MAP_ID = "AAHL-WINTER-2025-2026"

# One Durable Object instance owns the lease for one exact game. Its serialized
# requests provide the atomic acquire/renew/release boundary; KV is not used for
# lease arbitration.
[[durable_objects.bindings]]
name = "GAME_LEASES"
class_name = "GameLease"

[[durable_objects.bindings]]
name = "GAME_CODE_REGISTRY"
class_name = "GameCodeRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameLease"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GameCodeRegistry"]

# Session cookie store. Create with:
#   npx wrangler kv namespace create SESSION
# then paste the returned id below.
[[kv_namespaces]]
binding = "SESSION"
id = "18b534ed885d4cafac107884c0a070ba"

# Secrets (do NOT put these here — set them with wrangler):
#   npx wrangler secret put HTO_USERNAME
#   npx wrangler secret put HTO_PASSWORD
#   npx wrangler secret put APP_TOKEN
#   npx wrangler secret put GAME_CODE_PEPPER
